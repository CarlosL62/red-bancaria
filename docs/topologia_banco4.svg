<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1050" width="1400" height="1050" style="background:#0f172a; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- TITULO -->
  <text x="700" y="45" text-anchor="middle" fill="#f8fafc" font-size="24" font-weight="bold" letter-spacing="1">TOPOLOGÍA DE RED Y ARQUITECTURA TÉCNICA - BANCO 4</text>
  <text x="700" y="72" text-anchor="middle" fill="#94a3b8" font-size="14">Alta Disponibilidad Dual-ISP, Conexión al Anillo Interbancario y Segmentación VLAN</text>

  <!-- 1. ZONA ANILLO INTERBANCARIO -->
  <rect x="50" y="95" width="1300" height="165" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="2" stroke-dasharray="6 4" filter="url(#shadow)"/>
  <rect x="70" y="85" width="340" height="26" rx="6" fill="#0284c7"/>
  <text x="80" y="102" fill="#ffffff" font-size="12" font-weight="bold">ANILLO INTERBANCARIO (TRÁNSITO L3)</text>

  <!-- Nodo B3 -->
  <rect x="100" y="135" width="240" height="95" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
  <circle cx="140" cy="175" r="22" fill="#0284c7"/>
  <text x="140" y="181" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="bold">R</text>
  <text x="175" y="163" fill="#f8fafc" font-size="15" font-weight="bold">BANCO 3 (R-WAN)</text>
  <text x="175" y="183" fill="#38bdf8" font-size="12">IP: 10.0.0.9/30</text>
  <text x="175" y="201" fill="#94a3b8" font-size="11">Cloud: eno1 (Fa2/0)</text>

  <!-- Nodo INTERNET (Banco 4) -->
  <rect x="540" y="120" width="320" height="125" rx="14" fill="#1e1b4b" stroke="#818cf8" stroke-width="3" filter="url(#glow)"/>
  <circle cx="585" cy="170" r="26" fill="#4f46e5"/>
  <text x="585" y="177" text-anchor="middle" fill="#ffffff" font-size="20" font-weight="bold">B4</text>
  <text x="625" y="150" fill="#ffffff" font-size="16" font-weight="bold">INTERNET (Router Borde)</text>
  <text x="625" y="170" fill="#a5b4fc" font-size="12">Alpine Linux 3.20 (L3 Forwarding)</text>
  <text x="625" y="190" fill="#38bdf8" font-size="11">eth3: 10.0.0.10/30 (a B3) | eth4: 10.0.0.13/30 (a B5)</text>
  <text x="625" y="208" fill="#f59e0b" font-size="11">eth0: 100.64.1.2/30 (ISP1) | eth1: 100.64.2.2/30 (ISP2)</text>
  <text x="625" y="226" fill="#10b981" font-size="11">eth2: 10.255.4.2/24 (Salida Real / NAT)</text>

  <!-- Nodo B5 -->
  <rect x="1060" y="135" width="240" height="95" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
  <circle cx="1100" cy="175" r="22" fill="#0284c7"/>
  <text x="1100" y="181" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="bold">R</text>
  <text x="1135" y="163" fill="#f8fafc" font-size="15" font-weight="bold">BANCO 5 (R-WAN)</text>
  <text x="1135" y="183" fill="#38bdf8" font-size="12">IP: 10.0.0.14/30</text>
  <text x="1135" y="201" fill="#94a3b8" font-size="11">Cloud: enxc0eac367f731</text>

  <!-- Enlaces Anillo -->
  <line x1="340" y1="175" x2="540" y2="175" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
  <text x="440" y="165" text-anchor="middle" fill="#7dd3fc" font-size="11" font-weight="bold">10.0.0.8/30</text>
  <text x="440" y="192" text-anchor="middle" fill="#94a3b8" font-size="10">Primaria M10 / Flotante M20</text>

  <line x1="860" y1="175" x2="1060" y2="175" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
  <text x="960" y="165" text-anchor="middle" fill="#7dd3fc" font-size="11" font-weight="bold">10.0.0.12/30</text>
  <text x="960" y="192" text-anchor="middle" fill="#94a3b8" font-size="10">Primaria M10 / Flotante M20</text>


  <!-- 2. ZONA DOBLE ISP -->
  <rect x="250" y="290" width="900" height="160" rx="16" fill="#1e293b" stroke="#f59e0b" stroke-width="2" stroke-dasharray="6 4" filter="url(#shadow)"/>
  <rect x="270" y="280" width="380" height="26" rx="6" fill="#d97706"/>
  <text x="280" y="297" fill="#ffffff" font-size="12" font-weight="bold">PROVEEDORES INTERNOS (ALTA DISPONIBILIDAD ISP1 / ISP2)</text>

  <!-- ISP1 -->
  <rect x="330" y="330" width="260" height="95" rx="12" fill="#0f172a" stroke="#f59e0b" stroke-width="2"/>
  <circle cx="370" cy="375" r="22" fill="#d97706"/>
  <text x="370" y="381" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="bold">ISP1</text>
  <text x="405" y="358" fill="#f8fafc" font-size="15" font-weight="bold">ISP 1 (Cisco 7200)</text>
  <text x="405" y="378" fill="#fbbf24" font-size="11">WAN: 100.64.1.1/30 (a INTERNET)</text>
  <text x="405" y="396" fill="#f87171" font-size="11">LAN: 200.4.1.1/30 (a FW-BANCO4)</text>

  <!-- ISP2 -->
  <rect x="810" y="330" width="260" height="95" rx="12" fill="#0f172a" stroke="#f59e0b" stroke-width="2"/>
  <circle cx="850" cy="375" r="22" fill="#d97706"/>
  <text x="850" y="381" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="bold">ISP2</text>
  <text x="885" y="358" fill="#f8fafc" font-size="15" font-weight="bold">ISP 2 (Cisco 7200)</text>
  <text x="885" y="378" fill="#fbbf24" font-size="11">WAN: 100.64.2.1/30 (a INTERNET)</text>
  <text x="885" y="396" fill="#f87171" font-size="11">LAN: 200.4.2.1/30 (a FW-BANCO4)</text>

  <!-- Enlaces INTERNET -> ISPs -->
  <path d="M 650 245 L 650 270 L 460 270 L 460 330" fill="none" stroke="#f59e0b" stroke-width="2.5"/>
  <text x="530" y="265" text-anchor="middle" fill="#fcd34d" font-size="10">eth0: 100.64.1.2 ↔ 100.64.1.1</text>

  <path d="M 750 245 L 750 270 L 940 270 L 940 330" fill="none" stroke="#f59e0b" stroke-width="2.5"/>
  <text x="870" y="265" text-anchor="middle" fill="#fcd34d" font-size="10">eth1: 100.64.2.2 ↔ 100.64.2.1</text>


  <!-- 3. ZONA FIREWALL PERIMETRAL -->
  <rect x="440" y="490" width="520" height="125" rx="16" fill="#450a0a" stroke="#ef4444" stroke-width="3" filter="url(#glow)"/>
  <rect x="460" y="480" width="280" height="24" rx="6" fill="#dc2626"/>
  <text x="470" y="496" fill="#ffffff" font-size="11" font-weight="bold">PERÍMETRO Y SEGURIDAD (NFTABLES)</text>

  <circle cx="490" cy="550" r="25" fill="#b91c1c"/>
  <text x="490" y="556" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="bold">FW</text>
  <text x="530" y="535" fill="#ffffff" font-size="16" font-weight="bold">FW-BANCO4 (Alpine Linux)</text>
  <text x="530" y="555" fill="#fca5a5" font-size="12">Firewall nftables + Script de Failover ISP1 ↔ ISP2</text>
  <text x="530" y="575" fill="#fca5a5" font-size="11">eth0: 200.4.1.2/30 (ISP1 - Activo) | eth1: 200.4.2.2/30 (ISP2 - Backup)</text>
  <text x="530" y="595" fill="#22d3ee" font-size="11">eth2: Troncal 802.1Q (VLAN 10: .41.1 | VLAN 20: .42.1 | VLAN 30: .43.1)</text>

  <!-- Enlaces ISP -> FW -->
  <line x1="460" y1="425" x2="520" y2="490" stroke="#ef4444" stroke-width="2.5"/>
  <text x="465" y="460" text-anchor="middle" fill="#fca5a5" font-size="10">200.4.1.0/30</text>

  <line x1="940" y1="425" x2="880" y2="490" stroke="#ef4444" stroke-width="2.5" stroke-dasharray="4 2"/>
  <text x="935" y="460" text-anchor="middle" fill="#fca5a5" font-size="10">200.4.2.0/30 (Backup)</text>


  <!-- 4. CORE SWITCH -->
  <rect x="550" y="655" width="300" height="65" rx="10" fill="#042f2e" stroke="#14b8a6" stroke-width="2.5"/>
  <circle cx="585" cy="687" r="18" fill="#0d9488"/>
  <text x="585" y="692" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold">SW</text>
  <text x="615" y="680" fill="#ffffff" font-size="14" font-weight="bold">SW-B4 (Open vSwitch Core)</text>
  <text x="615" y="700" fill="#5eead4" font-size="11">Troncal 802.1Q (VLANs 10, 20, 30)</text>

  <!-- Troncal FW -> SW -->
  <line x1="700" y1="615" x2="700" y2="655" stroke="#14b8a6" stroke-width="4"/>
  <text x="755" y="640" fill="#2dd4bf" font-size="11" font-weight="bold">Trunk eth2</text>


  <!-- 5. ZONA DE VLANS / SEGMENTACIÓN -->

  <!-- VLAN 10 -->
  <rect x="50" y="760" width="380" height="240" rx="14" fill="#064e3b" stroke="#10b981" stroke-width="2" filter="url(#shadow)"/>
  <rect x="70" y="750" width="280" height="24" rx="6" fill="#059669"/>
  <text x="80" y="766" fill="#ffffff" font-size="11" font-weight="bold">VLAN 10: USUARIOS (192.168.41.0/24)</text>

  <rect x="90" y="810" width="300" height="120" rx="10" fill="#022c22" stroke="#34d399" stroke-width="1.5"/>
  <circle cx="130" cy="870" r="22" fill="#059669"/>
  <text x="130" y="876" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="bold">PC</text>
  <text x="165" y="850" fill="#ffffff" font-size="15" font-weight="bold">PC-USUARIO</text>
  <text x="165" y="872" fill="#6ee7b7" font-size="12">IP: 192.168.41.10/24</text>
  <text x="165" y="892" fill="#94a3b8" font-size="11">Gateway: 192.168.41.1 (FW)</text>
  <text x="165" y="912" fill="#a7f3d0" font-size="11">Cliente de pruebas y transacciones</text>

  <!-- Enlace SW -> VLAN 10 -->
  <path d="M 600 720 L 600 745 L 240 745 L 240 810" fill="none" stroke="#10b981" stroke-width="2.5"/>
  <text x="380" y="740" text-anchor="middle" fill="#6ee7b7" font-size="10">VLAN 10 Access</text>


  <!-- VLAN 20 -->
  <rect x="470" y="760" width="460" height="240" rx="14" fill="#172554" stroke="#3b82f6" stroke-width="2" filter="url(#shadow)"/>
  <rect x="490" y="750" width="310" height="24" rx="6" fill="#2563eb"/>
  <text x="500" y="766" fill="#ffffff" font-size="11" font-weight="bold">VLAN 20: BANCA APP &amp; DB (192.168.42.0/24)</text>

  <!-- App Server -->
  <rect x="490" y="800" width="200" height="130" rx="10" fill="#0f172a" stroke="#60a5fa" stroke-width="1.5"/>
  <circle cx="525" cy="845" r="18" fill="#2563eb"/>
  <text x="525" y="850" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold">APP</text>
  <text x="555" y="840" fill="#ffffff" font-size="13" font-weight="bold">SRV-BANCA-APP-1</text>
  <text x="555" y="860" fill="#93c5fd" font-size="11">192.168.42.20/24</text>
  <text x="555" y="880" fill="#fbbf24" font-size="11">Puerto: 5000 (Flask)</text>
  <text x="555" y="900" fill="#94a3b8" font-size="10">GW: 192.168.42.1</text>

  <!-- DB Server -->
  <rect x="710" y="800" width="200" height="130" rx="10" fill="#0f172a" stroke="#60a5fa" stroke-width="1.5"/>
  <circle cx="745" cy="845" r="18" fill="#2563eb"/>
  <text x="745" y="850" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold">DB</text>
  <text x="775" y="840" fill="#ffffff" font-size="13" font-weight="bold">SRV-BANCA-DB-1</text>
  <text x="775" y="860" fill="#93c5fd" font-size="11">192.168.42.10/24</text>
  <text x="775" y="880" fill="#34d399" font-size="11">PostgreSQL 5432</text>
  <text x="775" y="900" fill="#94a3b8" font-size="10">GW: 192.168.42.1</text>

  <!-- Enlace App <-> DB -->
  <line x1="690" y1="865" x2="710" y2="865" stroke="#38bdf8" stroke-width="2" stroke-dasharray="3 2"/>

  <!-- Enlace SW -> VLAN 20 -->
  <line x1="700" y1="720" x2="700" y2="760" stroke="#3b82f6" stroke-width="2.5"/>


  <!-- VLAN 30 -->
  <rect x="970" y="760" width="380" height="240" rx="14" fill="#431407" stroke="#f97316" stroke-width="2" filter="url(#shadow)"/>
  <rect x="990" y="750" width="320" height="24" rx="6" fill="#ea580c"/>
  <text x="1000" y="766" fill="#ffffff" font-size="11" font-weight="bold">VLAN 30: SERVICIOS &amp; DMZ (192.168.43.0/24)</text>

  <!-- Archivos / Blacklist Server -->
  <rect x="990" y="800" width="340" height="85" rx="10" fill="#1c1917" stroke="#fb923c" stroke-width="2"/>
  <circle cx="1025" cy="842" r="18" fill="#ea580c"/>
  <text x="1025" y="847" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="bold">API</text>
  <text x="1055" y="830" fill="#ffffff" font-size="13" font-weight="bold">SRV-ARCHIVOS (Blacklist API)</text>
  <text x="1055" y="850" fill="#fed7aa" font-size="11">192.168.43.20/24 | Puerto: 8080 (REST)</text>
  <text x="1055" y="870" fill="#4ade80" font-size="10">Publicado al anillo (10.0.0.10 &amp; 10.0.0.13:8080)</text>

  <!-- Admin PC -->
  <rect x="990" y="900" width="340" height="75" rx="10" fill="#1c1917" stroke="#fb923c" stroke-width="1.5"/>
  <circle cx="1025" cy="937" r="18" fill="#ea580c"/>
  <text x="1025" y="942" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="bold">ADM</text>
  <text x="1055" y="930" fill="#ffffff" font-size="13" font-weight="bold">PC-ADMIN (Gestión y Control)</text>
  <text x="1055" y="952" fill="#fed7aa" font-size="11">192.168.43.10/24 | GW: 192.168.43.1</text>

  <!-- Enlace SW -> VLAN 30 -->
  <path d="M 800 720 L 800 745 L 1160 745 L 1160 760" fill="none" stroke="#f97316" stroke-width="2.5"/>
  <text x="1010" y="740" text-anchor="middle" fill="#fdba74" font-size="10">VLAN 30 Access</text>

</svg>